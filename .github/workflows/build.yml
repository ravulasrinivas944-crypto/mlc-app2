name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/mlc-release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK build skipped. Configure the Android signing secrets described in README.md to enable install-over updates."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        if: steps.signing.outputs.ready == 'true'
      - run: mkdir www
        if: steps.signing.outputs.ready == 'true'
      - run: cp -r index.html style.css app.js config.js manifest.json sw.js vendor icons www/
        if: steps.signing.outputs.ready == 'true'
      - run: npx cap add android
        if: steps.signing.outputs.ready == 'true'
      - run: python3 native/patch_android.py
        if: steps.signing.outputs.ready == 'true'
      - run: npx cap sync android
        if: steps.signing.outputs.ready == 'true'
      - name: Install signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
      - name: Validate signing key
        if: steps.signing.outputs.ready == 'true'
        run: |
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Could not open the uploaded keystore. Re-copy ANDROID_KEYSTORE_BASE64 from the same local keystore file and confirm ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore password is accepted, but ANDROID_KEY_ALIAS was not found. Set it to the exact alias shown by keytool."
            exit 1
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
        if: steps.signing.outputs.ready == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: MLC-Ward-List-APK
          path: android/app/build/outputs/apk/release/*.apk
