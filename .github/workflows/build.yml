name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: mkdir -p www/vendor www/icons
      - run: cp index.html style.css app.js data.js manifest.json sw.js www/
      - run: cp react.production.min.js react-dom.production.min.js htm.umd.js www/vendor/
      - run: cp icon-192.png icon-512.png www/icons/
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MLC-Outreach-APK
